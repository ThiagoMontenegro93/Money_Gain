name: Android APK

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publicar o APK como pre-release do GitHub (para baixar fora do Actions)'
        type: boolean
        default: false
  push:
    paths:
      - 'apps/app/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/apk-smoke.sh'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      KS_B64: ${{ secrets.LENDCONTROL_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.LENDCONTROL_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      # Sem a chave de release (secret), o APK sai assinado com a chave de debug;
      # a assinatura final é feita fora do CI com apksigner (ver docs/ANDROID.md).
      - name: Assinatura (opcional)
        if: ${{ env.KS_B64 != '' }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "LENDCONTROL_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "LENDCONTROL_STORE_PASSWORD=$KS_PASS"
            echo "LENDCONTROL_KEY_ALIAS=lendcontrol"
            echo "LENDCONTROL_KEY_PASSWORD=$KS_PASS"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "KEYSTORE_PROPS=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: apps/app
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lendcontrol-pro-apk
          path: apps/app/dist-android/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Pre-release com o APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-build-${{ github.run_number }}" apps/app/dist-android/*.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "APK de teste #${{ github.run_number }}" \
            --notes "Build automático do app Android (${{ github.ref_name }}). Assinatura: ${KS_B64:+chave de release}${KS_B64:-chave de debug, só para testes}."

  # Item 8: cada APK gerado é instalado e aberto num celular Android emulado.
  # Falha se o app não instalar, fechar sozinho (crash) ou não mostrar a tela de entrada.
  emulador:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lendcontrol-pro-apk
          path: apk
      - name: Liberar KVM (aceleração do emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar e abrir no emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/apk-smoke.sh apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador-telas
          path: emulador/
          if-no-files-found: ignore
          retention-days: 14
